# Configuração do Mosquitto para o SalaConforto (fase 2, demonstração).
# Uso, a partir da pasta do projeto:  mosquitto -c broker/mosquitto.conf -v

# Aceita conexões da rede local (a placa real fica em outro aparelho)
listener 1883 0.0.0.0

# Sem senha: só para a demonstração na rede local (a senha por placa fica para uma próxima fase)
allow_anonymous true

# Guarda as sessões e as mensagens em disco a cada 60 s e ao desligar: num reinício normal,
# as leituras esperando pelo gravador não se perdem; numa queda brusca, perde-se até 1 minuto.
# O caminho é relativo: rode o broker a partir da pasta do projeto.
persistence true
persistence_location broker/data/
autosave_interval 60
